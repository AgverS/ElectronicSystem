name: CI

# Runs on every push to dev and on pull requests into main, so problems are
# caught before anything reaches production.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        # Generated from the schema, so it is not committed.
        run: pnpm prisma generate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify the demo database
        run: pnpm check:demo-db

      - name: Build
        run: pnpm build
